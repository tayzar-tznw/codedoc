[pytest]
testpaths = tests
markers =
    go: builds and runs the real gohelper or go command with a Go toolchain (deselected by default; run with -m go --no-cov)
    network: needs the network, e.g. download mode against the real module proxy (deselected by default; run with -m network --no-cov)
# LEIDEN-HOOK: tests/leiden_plugin.py skips the codedoc_go tests whose expectations are codedoc_go's own
addopts = -m "not go and not network" -p tests.leiden_plugin --cov=graph_generator --cov-report=term-missing --cov-fail-under=85
